<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="120" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="220" fill="#059669" opacity="0.1" filter="url(#glow)" />

  <!-- Top Brand Tag -->
  <g transform="translate(100, 110)">
    <rect width="170" height="40" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="20" r="6" fill="#10b981" />
    <text x="38" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">FITMANAGE OS</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    Smart Gym Management
  </text>
  <text x="100" y="315" fill="url(#emeraldGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="-1">
    &amp; Member Self-Service PWA
  </text>

  <!-- Subtitle -->
  <text x="100" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Automated 4-stage WhatsApp renewals • Zero SMS API bills • Instant digital pass
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="280" height="54" rx="27" fill="#13232a" stroke="#10b981" stroke-width="1.5" />
    <text x="28" y="33" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">⚡ Direct WhatsApp Web</text>

    <!-- Pill 2 -->
    <rect x="300" y="0" width="260" height="54" rx="27" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="328" y="33" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">📱 App-Free Member Pass</text>

    <!-- Pill 3 -->
    <rect x="580" y="0" width="240" height="54" rx="27" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="608" y="33" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">📊 Real-Time Studio POS</text>
  </g>

  <!-- Card Illustration Box on Right -->
  <g transform="translate(880, 160)">
    <rect width="220" height="290" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="25" y="25" width="170" height="150" rx="16" fill="#0f172a" />
    <circle cx="110" cy="100" r="40" fill="#10b981" opacity="0.2" />
    
    <!-- Dumbbell Icon -->
    <g transform="translate(85, 75)">
      <rect x="0" y="14" width="8" height="22" rx="3" fill="#10b981" />
      <rect x="10" y="18" width="6" height="14" rx="2" fill="#10b981" />
      <rect x="16" y="22" width="20" height="6" rx="2" fill="#e2e8f0" />
      <rect x="36" y="18" width="6" height="14" rx="2" fill="#10b981" />
      <rect x="44" y="14" width="8" height="22" rx="3" fill="#10b981" />
    </g>

    <text x="110" y="215" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">FIT-1001</text>
    <text x="110" y="240" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">● ACTIVE MEMBER</text>
    <text x="110" y="265" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Expires in 28 Days</text>
  </g>

  <!-- Bottom URL Bar -->
  <text x="100" y="555" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
    https://fitmanage-p8bc.onrender.com
  </text>
</svg>