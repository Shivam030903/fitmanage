    <!-- Open Graph / WhatsApp / Facebook Link Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitmanage-p8bc.onrender.com/" />
    <meta property="og:site_name" content="FitManage" />
    <meta property="og:title" content="FitManage - Smart Gym & Fitness Studio Management" />
    <meta property="og:description" content="All-in-one Gym Management: Automated 4-stage WhatsApp renewal follow-ups, Member PWA pass, and instant payment receipts." />
    <meta property="og:image" content="https://fitmanage-p8bc.onrender.com/og-banner.png" />
    <meta property="og:image:secure_url" content="https://fitmanage-p8bc.onrender.com/og-banner.png" />

    <meta property="og:image:width" content="1200" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="FitManage - Smart Gym Management" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="FitManage" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Early catch of beforeinstallprompt for PWA install button
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAEvent = e;
      });

      // Register Service Worker for PWA with automatic fresh update detection
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('FitManage PWA Service Worker registered:', reg.scope);
              reg.update();
              reg.onupdatefound = () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.onstatechange = () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New FitManage version installed, reloading fresh...');
                      window.location.reload();
                    }
                  };
                }
              };
            })
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
