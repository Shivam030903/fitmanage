services:
  - type: web
    name: fitmanage
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
